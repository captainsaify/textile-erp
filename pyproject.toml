[project]
name = "textile-erp"
version = "0.1.0"
description = "WhatsApp-native trading ERP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "typer>=0.13",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "pdf2image>=1.17",
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Money/quantity fields must never be float -- see docs/17_CodingStandards.md §1.
# (Mechanical enforcement of this rule is a documented follow-up; reviewed by hand for now.)

[tool.ruff.lint.per-file-ignores]
# autogenerated by alembic; long lines and legacy typing come from the generator
"alembic/versions/*" = ["E501", "UP007", "UP035", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

# OCR engines ship no type stubs; their call sites are narrowly wrapped
# in backend/ocr/engines.py and guarded at runtime.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "paddleocr.*", "pdf2image.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
