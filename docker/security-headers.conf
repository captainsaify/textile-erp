# Response headers every route must carry -- docs/14_Security.md.
#
# Kept in an include because nginx stops inheriting `add_header` into any
# block that declares one of its own. The dashboard's `location` blocks
# set Cache-Control, which silently dropped every security header from
# the HTML and the assets while /api/ kept them. Re-include this file in
# any block that adds a header of its own.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# The dashboard is hand-written HTML/CSS/JS with no build step, no CDN
# and no third-party anything (docs/21 §5), so it can afford the strict
# policy that a framework app usually cannot.
#
# - 'unsafe-inline' for style-src only: charts.js sets geometry through
#   inline style attributes. Scripts are all separate files, so script-src
#   needs no such escape and does not get one.
# - connect-src 'self': the API is same-origin. Anything trying to ship
#   data elsewhere is not us.
# - img-src includes blob: because sheets and scans are fetched with the
#   bearer token and rendered from object URLs.
# - frame-ancestors 'none' is the CSP form of X-Frame-Options, and the
#   one modern browsers actually enforce.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
