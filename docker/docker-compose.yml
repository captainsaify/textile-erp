# docs/16_Deployment.md §2. Run from the repo root:
#   docker compose -f docker/docker-compose.yml up -d
#
# Postgres and Redis are deliberately not published on host ports: they
# are reachable only inside the compose network. Local development adds
# them back via docker-compose.override.local.yml.

name: textile-erp

x-app-env: &app-env
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ATTACHMENTS_DIR: /data/attachments

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    <<: *app-env
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot: migrations run to completion before anything serves
  # traffic, rather than racing several API replicas all trying to
  # migrate at once (docs/16_Deployment.md §6).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Queue split per docs/11_BackgroundWorkers.md §2: a burst of OCR work
  # must never starve the latency-sensitive WhatsApp send queue.
  worker-whatsapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "whatsapp", "-c", "8", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends

  worker-ocr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    # low concurrency, high per-task CPU/memory: OCR is the opposite
    # shape from message sending
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "ocr", "-c", "2", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends
    deploy:
      resources:
        limits:
          memory: 2g

  worker-scheduled:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "scheduled,backup,reports", "-c", "4", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
      - reports:/data/reports
    depends_on: *app-depends

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    command: ["celery", "-A", "backend.workers.app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  attachments:
  backups:
  reports:
  certbot_www:
