# docs/16_Deployment.md §4. TLS terminates here; the app never sees
# plain HTTP from the internet.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log json;

    # Docker's embedded DNS, re-checked every 10s. Without this nginx
    # resolves `api` once at startup and caches that IP forever -- so
    # every rebuild gave the api container a new address while nginx
    # kept posting to the old one, and Meta got 502s until nginx
    # happened to be restarted. The bot went silent with the app
    # perfectly healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # An `upstream` block would re-introduce the same caching, so the
    # address goes through a variable, which forces resolution per
    # request. The cost is upstream keepalive; at this traffic level
    # that is nothing next to silently dropping webhooks.
    map $host $api_upstream {
        default "api:8000";
    }

    # WhatsApp retries webhooks it thinks failed, so the window here is
    # generous enough that a slow-but-succeeding request isn't cut off
    # and redelivered as a duplicate.
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 20m;   # scanned invoices; API also enforces its own limit

    # Meta's webhook bursts are legitimate traffic; the app has its own
    # per-sender limiting (docs/08_WhatsApp.md §3). This only stops
    # something pathological reaching the app at all.
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/s;

    # Sign-in. There is no lockout in the application layer, so without
    # this the login endpoint accepts unlimited password guesses from one
    # address -- verified against the live deployment: twelve wrong
    # passwords in a row, twelve 401s, no throttling. Two partners
    # signing in a few times a week need nowhere near 12/min; an
    # offline-speed guessing attack needs far more.
    limit_req_zone $binary_remote_addr zone=login:10m rate=12r/m;

    # Everything else on the API. Generous enough that the dashboard's
    # burst of parallel loads on page open is untouched.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # 429, not 503: a client that is being throttled should be told to
    # slow down, not told the server is broken.
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # ACME challenges must stay on plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Also here, not only on :80. When the site is fronted by the
        # Cloudflare tunnel the ingress speaks to https://nginx:443, so a
        # challenge arriving that way never reaches the :80 block and
        # falls through to the SPA -- which answers 200 with index.html,
        # so the ACME client is told the file exists and reads a web page
        # where the token should be. Harmless when serving direct: on
        # :80 the location above wins first.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # These four live in an include, not inline, because of an nginx
        # rule that is easy to be caught by: `add_header` is inherited
        # only while the child block declares *no* add_header of its own.
        # The moment `location = /index.html` set a Cache-Control, it
        # silently dropped all four -- so every one of them was present
        # on /api/ and absent from the actual dashboard page. Verified
        # against production before this change: the HTML came back with
        # cache-control alone, no HSTS, no X-Frame-Options, no nosniff.
        # Any block below that adds a header must re-include this.
        include /etc/nginx/security-headers.conf;

        location /webhooks/ {
            limit_req zone=webhook burst=60 nodelay;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            access_log off;
            proxy_pass http://$api_upstream;
        }

        # Sign-in is the one endpoint worth guessing at, so it gets its
        # own much tighter bucket. `burst=5` absorbs a fat-fingered
        # retry; sustained guessing gets 429s.
        location /api/v1/auth/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The API keeps its own prefix, so the dashboard can own `/`.
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Master Control is a separate document, not a route inside the
        # dashboard (ui-plan.md §12): different credential, different
        # session, different lifetime. Without this it would fall through
        # the catch-all below and quietly serve the dashboard instead.
        #
        # The include is not optional: `add_header` is inherited only
        # while the child block declares none of its own, so adding
        # Cache-Control here without re-including would strip HSTS,
        # X-Frame-Options and nosniff from this page alone -- which is
        # the page that can delete things.
        location = /control {
            root /usr/share/nginx/html;
            try_files /control.html =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # The dashboard: static files, no build step and so no build
        # service (docs/21_WebDashboard.md §5, §7). Mounted read-only;
        # nginx serves it directly.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # index.html must not be cached or a deploy leaves people on
            # the old app pointing at a new API; the fingerprint-free
            # assets get a short cache instead of a long one for the
            # same reason.
            location = /index.html {
                include /etc/nginx/security-headers.conf;
                add_header Cache-Control "no-store" always;
            }
            location /assets/ {
                include /etc/nginx/security-headers.conf;
                add_header Cache-Control "public, max-age=300" always;
            }
        }
    }
}
