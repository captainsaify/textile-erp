# docs/16_Deployment.md §4. TLS terminates here; the app never sees
# plain HTTP from the internet.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log json;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    # WhatsApp retries webhooks it thinks failed, so the window here is
    # generous enough that a slow-but-succeeding request isn't cut off
    # and redelivered as a duplicate.
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 20m;   # scanned invoices; API also enforces its own limit

    # Meta's webhook bursts are legitimate traffic; the app has its own
    # per-sender limiting (docs/08_WhatsApp.md §3). This only stops
    # something pathological reaching the app at all.
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # ACME challenges must stay on plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location /webhooks/ {
            limit_req zone=webhook burst=60 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            access_log off;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
