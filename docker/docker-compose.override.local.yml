# Local development only -- publishes the datastores on host ports so
# psql and redis-cli work directly. Never used in production, where both
# stay inside the compose network (docs/16_Deployment.md §2).
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.override.local.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "8000:8000"
