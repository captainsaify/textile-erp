# docs/16_Deployment.md §2. Run from the repo root:
#   docker compose up -d
#
# This file lives at the root, not in docker/, on purpose: compose reads
# `.env` for variable interpolation from the directory containing the
# compose file. From docker/ it would look for docker/.env, find
# nothing, and silently start Postgres with an empty username -- a
# failure that only appears on first boot.
#
# Postgres and Redis are deliberately not published on host ports: they
# are reachable only inside the compose network. Local development adds
# them back via docker-compose.override.local.yml.

name: textile-erp

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ATTACHMENTS_DIR: /data/attachments

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy

  # The public entrance. `docker compose up -d` skips it until .env sets
  # COMPOSE_PROFILES=tunnel, so the stack still starts cleanly on a
  # machine that has no tunnel credentials (docs/16_Deployment.md §11).
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    profiles: ["tunnel"]
    command:
      - tunnel
      # the image is pinned above; self-updating would silently change
      # the running binary out from under that pin
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - --metrics
      - 0.0.0.0:2000
      - run
      - ${CLOUDFLARE_TUNNEL_ID}
    volumes:
      - ./docker/cloudflared:/etc/cloudflared:ro
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      # /ready reports the number of established edge connections, so
      # this goes unhealthy when the tunnel is up but connected to
      # nothing -- exactly the state a dead quick tunnel was in, and the
      # state that used to be invisible until someone messaged the bot.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    <<: *app-env
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot: migrations run to completion before anything serves
  # traffic, rather than racing several API replicas all trying to
  # migrate at once (docs/16_Deployment.md §6).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Queue split per docs/11_BackgroundWorkers.md §2: a burst of OCR work
  # must never starve the latency-sensitive WhatsApp send queue.
  worker-whatsapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "whatsapp", "-c", "8", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends

  worker-ocr:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    # low concurrency, high per-task CPU/memory: OCR is the opposite
    # shape from message sending
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "ocr", "-c", "2", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
    depends_on: *app-depends
    deploy:
      resources:
        limits:
          memory: 2g

  worker-scheduled:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    command: ["celery", "-A", "backend.workers.app", "worker", "-Q", "scheduled,backup,reports", "-c", "4", "--loglevel=info"]
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
      - reports:/data/reports
    depends_on: *app-depends

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    <<: *app-env
    # Beat persists its "last fired" state to a dbm file. It defaults to
    # the working directory, which is root-owned by design, so it is
    # pointed at a volume: on a writable path *and* durable, so a
    # restart doesn't re-fire jobs it already ran.
    command:
      - celery
      - -A
      - backend.workers.app
      - beat
      - --loglevel=info
      - --schedule=/data/celery/celerybeat-schedule
      - --pidfile=
    volumes:
      - celery_state:/data/celery
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  celery_state:
  pg_data:
  redis_data:
  attachments:
  backups:
  reports:
  certbot_www:
